<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Face Lock</title><link rel="stylesheet" href="style.css"></head><body><main><h1>🔐 AI Face Lock</h1><p class="sub">YuNet + SFace • Browser-based demo</p><section class="card"><video id="video" autoplay muted playsinline></video><canvas id="canvas" hidden></canvas><div class="status" id="status">Connecting…</div><div class="buttons"><button onclick="startCamera()">Start Camera</button><button onclick="register()">Register Face</button><button onclick="unlock()">Face Unlock</button></div></section><section class="card form"><input id="uid" placeholder="User ID (e.g. STU101)"><input id="name" placeholder="Full name"><p class="hint">Registration captures 5 frames. Unlock captures several frames and asks you to move slightly.</p></section><section class="card"><h2>Result</h2><pre id="result">Ready.</pre></section></main><script src="app.js"></script></body></html>
